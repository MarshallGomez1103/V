# S15.13: prototipo de Flatpak de VOZ. ID provisional (no registrado en Flathub).
# Plantilla: packaging/flatpak/build.sh sustituye EXTRAS_SPEC ("" o "[asr-local]")
# y prepara ./stage con el wheel, el .desktop, el icono y el metainfo.
# El runtime ya trae CPython 3.13 y FFmpeg (/usr/bin/ffmpeg, /usr/bin/ffprobe).
app-id: dev.voz.Voz
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: voz
finish-args:
  # Necesario: sin red el bucle local del sandbox no es alcanzable desde el
  # navegador del host. VOZ sigue escuchando solo en 127.0.0.1.
  - --share=network
  # GPU: /dev/dri y /dev/nvidia* (CUDA requiere ademas la extension GL.nvidia).
  - --device=all
modules:
  - name: voz
    buildsystem: simple
    build-options:
      # ponytail: el prototipo resuelve dependencias de PyPI en la compilacion.
      # Flathub exige fuentes fijadas y sin red (flatpak-pip-generator): pendiente.
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir "$(ls stage/*.whl)EXTRAS_SPEC"
      - install -Dm644 stage/dev.voz.Voz.desktop /app/share/applications/dev.voz.Voz.desktop
      - install -Dm644 stage/voz.svg /app/share/icons/hicolor/scalable/apps/dev.voz.Voz.svg
      - install -Dm644 stage/dev.voz.Voz.metainfo.xml /app/share/metainfo/dev.voz.Voz.metainfo.xml
    sources:
      - type: dir
        path: stage
        dest: stage
