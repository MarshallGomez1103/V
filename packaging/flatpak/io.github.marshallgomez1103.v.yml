# Experimental V Flatpak; the application ID is not registered on Flathub.
# build.sh replaces EXTRAS_SPEC ("" or "[asr-local]") and stages the wheel,
# desktop entry, icon and metainfo. Runtime 25.08 provides CPython and FFmpeg.
app-id: io.github.marshallgomez1103.v
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: v
finish-args:
  # The host browser needs access to the sandbox's loopback network.
  # V still listens only on 127.0.0.1.
  - --share=network
  # GPU: /dev/dri and /dev/nvidia* (CUDA also needs the GL.nvidia extension).
  - --device=all
modules:
  - name: voz
    buildsystem: simple
    build-options:
      # ponytail: resolve PyPI dependencies at build time for this prototype;
      # Flathub requires pinned, offline sources via flatpak-pip-generator.
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir "$(ls stage/*.whl)EXTRAS_SPEC"
      - install -Dm644 stage/io.github.marshallgomez1103.v.desktop /app/share/applications/io.github.marshallgomez1103.v.desktop
      - install -Dm644 stage/io.github.marshallgomez1103.v.svg /app/share/icons/hicolor/scalable/apps/io.github.marshallgomez1103.v.svg
      - install -Dm644 stage/io.github.marshallgomez1103.v.metainfo.xml /app/share/metainfo/io.github.marshallgomez1103.v.metainfo.xml
    sources:
      - type: dir
        path: stage
        dest: stage
