[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "voz-transcriber"
version = "0.1.0"
description = "Local-first voice workspace (V, formerly VOZ): long-form transcription today."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "V contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
asr-local = [
  "faster-whisper>=1.2.1,<2",
  # CTranslate2 loads CUDA 12 cuBLAS/cuDNN 9 at runtime; the pip wheels avoid
  # touching the host (immutable on Bazzite, no CUDA Toolkit on Windows). VOZ
  # preloads them explicitly (.so on Linux, DLL folders on Windows). macOS has no
  # CUDA: it always runs on CPU (int8). The markers are x86-64 only: aarch64
  # wheels exist but weigh ~1.35 GB and boards (Raspberry Pi...) have no NVIDIA
  # GPU, so ARM installs skip them and run on CPU (int8).
  "nvidia-cublas-cu12>=12.4,<13; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "nvidia-cudnn-cu12>=9.1,<10; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# Local speaker diarization without torch or gated tokens (ADR-0007):
# pyannote segmentation-3.0 and speaker embeddings as ONNX via sherpa-onnx.
diarization = [
  # Imported at runtime to turn PCM into float32 samples. It used to arrive only
  # through asr-local (ctranslate2); declaring it keeps diarization installable
  # (and type-checkable in CI) on its own.
  "numpy>=1.26,<3",
  "sherpa-onnx>=1.13.8,<2",
  # The cp314 wheel omits its runtime requirement; pin it explicitly.
  "sherpa-onnx-core==1.13.8",
]

[project.urls]
Homepage = "https://github.com/MarshallGomez1103/V"
Repository = "https://github.com/MarshallGomez1103/V"
Issues = "https://github.com/MarshallGomez1103/V/issues"

[project.scripts]
v = "voz.interfaces.cli.main:main"
voz = "voz.interfaces.cli.main:main"

[dependency-groups]
dev = [
  # fastapi.testclient needs httpx; without it only asr-local pulled it in.
  "httpx>=0.27,<1",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

# .gitignore is deliberately broad (`transcript.*`, `models/`, ...). Hatch would
# apply it and silently drop tracked sources such as domain/entities/transcript.py,
# so VCS ignores are off and every artifact lists what it ships explicitly.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/migrations",
  "/docs",
  "/scripts",
  "/apps/web/index.html",
  "/apps/web/public",
  "/apps/web/src",
  "/apps/web/*.json",
  "/apps/web/*.ts",
  "/apps/web/*.js",
  "/alembic.ini",
  "/uv.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
]
exclude = ["__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel]
packages = ["src/voz"]
exclude = ["__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "voz/infrastructure/persistence/alembic.ini"
"migrations" = "voz/infrastructure/persistence/migrations"

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "windows_ok: test guards its own POSIX-only details; do not auto-skip on Windows",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
